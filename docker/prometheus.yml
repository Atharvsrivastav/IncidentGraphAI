global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Scrape metrics exported by OpenTelemetry Collector
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          environment: 'development'
          cluster: 'local-sample-mesh'

  # Scrape sample microservices exposing standard Prometheus /metrics
  - job_name: 'incidentgraph-services'
    scrape_interval: 5s
    static_configs:
      - targets:
          - 'host.docker.internal:4000'
          - 'host.docker.internal:4001'
          - 'host.docker.internal:4002'
          - 'host.docker.internal:4003'
        labels:
          environment: 'development'
          cluster: 'local-sample-mesh'

  # Scrape Next.js application control-plane metrics
  - job_name: 'incidentgraph-app'
    scrape_interval: 5s
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          environment: 'development'
          cluster: 'local-sample-mesh'

  # Self-scrape Prometheus health metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Dynamic file-based target discovery for disposable test verification services
  - job_name: 'order-service-dynamic'
    scrape_interval: 1s
    file_sd_configs:
      - files:
          - '/etc/prometheus/file_sd/*.json'
          - './docker/file_sd/*.json'
        refresh_interval: 1s

