name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Initialize Database Schema
        run: npx prisma db push

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint

      - name: Run Test Suite (vitest)
        run: npm test

      - name: Run Root-Cause Reliability Benchmark
        run: npm run benchmark

      - name: Build Next.js Application
        run: npm run build

      - name: Run Browser E2E Test Suite
        env:
          PORT: 3000
          BASE_URL: "http://localhost:3000"
        run: |
          npm start &
          SERVER_PID=$!
          cleanup() {
            EXIT_CODE=$?
            echo "Stopping Next.js server (PID: $SERVER_PID)..."
            kill $SERVER_PID 2>/dev/null || true
            exit $EXIT_CODE
          }
          trap cleanup EXIT INT TERM

          node -e '
            async function wait() {
              for (let i = 0; i < 30; i++) {
                try {
                  const r = await fetch("http://localhost:3000/api/health");
                  if (r.ok) {
                    const d = await r.json();
                    if (d.status === "healthy") {
                      console.log("Next.js server is ready and healthy.");
                      process.exit(0);
                    }
                  }
                } catch {}
                await new Promise((res) => setTimeout(res, 1000));
              }
              console.error("Timeout waiting for server to be healthy");
              process.exit(1);
            }
            wait();
          '

          npm run test:browser
