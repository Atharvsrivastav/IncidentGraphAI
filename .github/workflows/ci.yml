name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Initialize Database Schema
        run: npx prisma db push

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint

      - name: Run Test Suite (vitest)
        run: npm test

      - name: Run Root-Cause Reliability Benchmark
        run: npm run benchmark

      - name: Build Next.js Application
        run: npm run build

      - name: Run Browser E2E Test Suite
        env:
          PORT: 3000
          BASE_URL: "http://localhost:3000"
        run: |
          set -m
          E2E_DB_FILE="prisma/e2e-ci-${GITHUB_RUN_ID:-$$}.db"
          export DATABASE_URL="file:./e2e-ci-${GITHUB_RUN_ID:-$$}.db"
          export E2E_ISOLATED="1"

          # Prepare isolated E2E database
          npx prisma db push --skip-generate
          npx tsx src/lib/db/seed.ts

          npm start &
          SERVER_PID=$!
          CLEANED_UP=0

          cleanup() {
            EXIT_CODE=$?
            if [ "$CLEANED_UP" -eq 1 ]; then
              exit $EXIT_CODE
            fi
            CLEANED_UP=1
            echo "Stopping Next.js server and child processes (PID: $SERVER_PID)..."
            kill -TERM -$SERVER_PID 2>/dev/null || kill -TERM $SERVER_PID 2>/dev/null || true
            pkill -TERM -P $SERVER_PID 2>/dev/null || true
            sleep 1
            kill -KILL -$SERVER_PID 2>/dev/null || kill -KILL $SERVER_PID 2>/dev/null || true
            pkill -KILL -P $SERVER_PID 2>/dev/null || true
            rm -f "$E2E_DB_FILE"* 2>/dev/null || true
            exit $EXIT_CODE
          }
          trap cleanup EXIT INT TERM

          node -e '
            async function wait() {
              for (let i = 0; i < 30; i++) {
                try {
                  const r = await fetch("http://localhost:3000/api/health");
                  if (r.ok) {
                    const d = await r.json();
                    if (d.status === "healthy" && d.database?.servicesCount === 7) {
                      console.log("Next.js server is ready and healthy with isolated database (7 services).");
                      process.exit(0);
                    }
                  }
                } catch {}
                await new Promise((res) => setTimeout(res, 1000));
              }
              console.error("Timeout waiting for server to be healthy");
              process.exit(1);
            }
            wait();
          '

          npm run test:browser
